[package]
name = "gramex"
description = "common language for advance parsers"
edition = "2024"
version = "0.2.0"
readme = "../readme.md"
license = "MIT"
repository = "https://github.com/aliibrahim123/gramex"
documentation = "https://docs.rs/gramex/"

[lib]
doctest = false

[features]
default = ["std"]
std = []
macros = ["dep:gramex-macro"]
str = []
bytes = []
bits = []


[dependencies]
gramex-macro = { version = "0.2.0", path = "../macro", optional = true }
lean_string = "0.7.0"
rustc-hash = "2.1.3"
